name: Build Clauditing.exe

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "clauditing.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements-app.txt pyinstaller pytest

      - name: Get ffmpeg (bundled inside the app)
        shell: pwsh
        run: |
          $zip = "ffmpeg.zip"
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          } catch {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffmpeg_dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin
          bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Test suite on Windows (with the bundled ffmpeg)
        shell: pwsh
        env:
          CLAUDITING_FFMPEG_DIR: ${{ github.workspace }}\bin
        run: |
          $env:PATH = "${{ github.workspace }}\bin;$env:PATH"
          python -m pytest -q

      - name: Build Clauditing.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Clauditing `
            --icon app/icon.ico --paths . `
            --add-data "app/ui;app/ui" `
            --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" `
            --collect-all webview `
            app/main.py
          Get-Item dist\Clauditing.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Clauditing-windows
          path: dist/Clauditing.exe

      - name: Publish to the "app" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $notes = "## Clauditing $version for Windows`n`nDownload **Clauditing.exe** below and run it. Nothing else to install.`n`nWindows may say it's from an unknown publisher: click *More info* then *Run anyway*.`n`nSee [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new. Built from ${{ github.sha }}."
          gh release view app *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create app dist/Clauditing.exe --title "Clauditing $version (Windows)" --notes $notes --latest
          } else {
            gh release upload app dist/Clauditing.exe --clobber
            gh release edit app --notes $notes --title "Clauditing $version (Windows)"
          }
