name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message or log
      description: Paste the error, or the log from the Make clips screen.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Windows app
        - Command line
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clauditing version
      description: Shown at the bottom of Settings in the app.
      placeholder: "0.3.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
